name: release
on:
  push:
    branches:
      - master
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git config --global user.email "robot@github.com"
      - run: git config --global user.name "homebrew-ih-public-action"
      - run: meta/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
